<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings — BookMyHotel</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <nav class="navbar" id="navbar"><div class="nav-container"><a href="/" class="nav-logo"><span>Book</span>MyHotel</a><ul class="nav-links" id="navLinks"><li><a href="/">Home</a></li><li><a href="/rooms.html">Rooms</a></li><li><a href="/facilities.html">Facilities</a></li><li><a href="/contact.html">Contact</a></li><li><a href="/about.html">About</a></li></ul><div class="nav-btns"><div id="authBtns"><button class="btn btn-outline btn-sm" onclick="openModal('loginModal')">Login</button><button class="btn btn-primary btn-sm" onclick="openModal('registerModal')">Register</button></div><div id="userMenu" style="display:none"><a href="/bookings.html" class="btn btn-ghost btn-sm"><i class="bi bi-calendar-check"></i> Bookings</a><button class="btn btn-outline btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i></button></div><button class="hamburger" onclick="toggleMobileMenu()"><span></span><span></span><span></span></button></div></div></nav>
    <div style="height:80px"></div>
    <section class="section">
        <div class="section-title"><h2>My Bookings</h2><p>Manage your reservations</p><div class="divider"></div></div>
        <div id="bookingsList"><div class="loader"><div class="spinner"></div></div></div>
    </section>
    <footer class="footer"><div class="footer-bottom"><p>&copy; 2024 BookMyHotel. All rights reserved.</p></div></footer>
    <div class="modal-overlay" id="loginModal"><div class="modal"><div class="modal-header"><h3>Welcome Back</h3><button class="modal-close" onclick="closeModal('loginModal')">&times;</button></div><div class="modal-body"><form onsubmit="handleLogin(event)"><div class="form-group"><label>Email</label><input type="email" id="loginEmail" required></div><div class="form-group"><label>Password</label><input type="password" id="loginPassword" required></div><button type="submit" class="btn btn-primary" style="width:100%">Login</button></form></div></div></div>
    <div class="modal-overlay" id="registerModal"><div class="modal"><div class="modal-header"><h3>Create Account</h3><button class="modal-close" onclick="closeModal('registerModal')">&times;</button></div><div class="modal-body"><form onsubmit="handleRegister(event)"><div class="form-group"><label>Name</label><input type="text" id="regName" required></div><div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div><div class="form-group"><label>Phone</label><input type="tel" id="regPhone"></div><div class="form-group"><label>Address</label><input type="text" id="regAddress"></div><div class="form-group"><label>Password</label><input type="password" id="regPassword" required minlength="6"></div><button type="submit" class="btn btn-primary" style="width:100%">Register</button></form></div></div></div>
    <div class="toast-container" id="toastContainer"></div>
    <script src="/js/app.js"></script>
</body>
</html>
